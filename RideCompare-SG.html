<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>RideCompare SG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px 28px}
.header{padding:22px 2px 26px}.logo{font-weight:800;font-size:19px}.logo span{color:#6b7280}
h1{font-size:38px;line-height:1.05;letter-spacing:-1.5px;margin:25px 0 8px}.sub{color:#6b7280;margin:0;line-height:1.45}
.card{background:#fff;border-radius:24px;padding:18px;margin-top:20px;box-shadow:0 8px 28px #0000000d}
.field{position:relative;margin-bottom:12px}.dot{position:absolute;left:15px;top:18px;width:9px;height:9px;border-radius:50%;background:#111827}
input{width:100%;border:1px solid #e5e7eb;background:#fafafa;border-radius:15px;padding:16px 16px 16px 38px;font-size:16px;outline:0}input:focus{background:#fff;border-color:#9ca3af}
button{width:100%;border:0;border-radius:15px;padding:16px;background:#111827;color:#fff;font-size:16px;font-weight:750;margin-top:2px}
.results{margin-top:20px}.route{font-size:13px;color:#6b7280;margin:0 3px 10px}.route b{color:#111827}
.ride{display:flex;align-items:center;background:#fff;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 6px 20px #0000000a}
.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;margin-right:12px;background:#f0f2f5}
.info{flex:1}.name{font-weight:800}.type{font-size:12px;color:#9ca3af;margin-top:3px}
.price{font-weight:800;margin-right:10px}.open{background:#111827;color:#fff;text-decoration:none;padding:10px 12px;border-radius:11px;font-size:12px;font-weight:750}
.badge{font-size:10px;background:#eef0f3;border-radius:7px;padding:3px 6px;margin-left:6px;color:#4b5563}
.tip{font-size:12px;color:#6b7280;line-height:1.5;margin:12px 4px}
small{color:#9ca3af}.footer{text-align:center;color:#9ca3af;font-size:11px;margin:25px}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="logo">🚕 RideCompare <span>SG</span></div>
<h1>一次输入，<br>一起比价。</h1>
<p class="sub">Grab、Gojek、TADA，不用重复输入起点和终点。</p>
</header>
<section class="card">
<div class="field"><i class="dot"></i><input id="from" placeholder="起点，例如 Tanjong Pagar"></div>
<div class="field"><i class="dot"></i><input id="to" placeholder="终点，例如 Changi Airport T3"></div>
<button onclick="compare()">Compare</button>
</section>
<div id="results"></div>
<div class="footer">RideCompare SG · MVP</div>
</div>
<script>
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function compare(){
 const f=document.getElementById('from').value.trim(),t=document.getElementById('to').value.trim();
 if(!f||!t){alert('请先输入起点和终点');return}
 const q=encodeURIComponent(f+' to '+t);
 document.getElementById('results').innerHTML=`
 <section class="results">
 <div class="route"><b>${esc(f)}</b> → <b>${esc(t)}</b></div>
 ${ride('🟢','Grab','GrabCar','查看当前价格','https://www.grab.com/sg/')}
 ${ride('🟡','Gojek','GoCar','查看当前价格','https://www.gojek.com/sg/')}
 ${ride('🔵','TADA','Car','查看当前价格','https://tada.global/')}
 <p class="tip">提示：目前三个平台没有提供给普通第三方网页直接读取消费者实时车费的统一公开接口，因此这里先把同一趟行程集中在一个页面，并提供一键打开平台。后续获得官方授权接口后，可直接在这里显示实时价格。</p>
 </section>`;
}
function ride(icon,name,type,label,url){
 return `<div class="ride"><div class="icon">${icon}</div><div class="info"><div class="name">${name}<span class="badge">SG</span></div><div class="type">${type}</div></div><div class="price">—</div><a class="open" href="${url}" target="_blank">打开</a></div>`;
}
</script>
</body>
</html>
