<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>RideCompare SG — Grab / Gojek / TADA 比价</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:600px;margin:auto;padding:22px 16px 44px}.brand{font-size:27px;font-weight:850;letter-spacing:-.5px;margin:10px 0 4px}.sub{color:#6b7280;font-size:14px;margin-bottom:18px}.card{background:#fff;border-radius:20px;padding:17px;box-shadow:0 5px 22px rgba(17,24,39,.07);margin-bottom:14px}label{display:block;font-size:12px;color:#6b7280;margin:2px 0 6px}input{width:100%;padding:15px 14px;border:1px solid #e5e7eb;border-radius:13px;font-size:16px;outline:none;margin-bottom:11px;background:#fff}input:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.06)}button{border:0;border-radius:13px;padding:13px 15px;font-size:15px;font-weight:750;cursor:pointer;-webkit-tap-highlight-color:transparent}.primary{width:100%;background:#111827;color:#fff;font-size:16px;min-height:50px}.primary:disabled{opacity:.55}.status{color:#6b7280;font-size:13px;text-align:center;padding:3px 0 12px}.status.success{color:#15803d}.status.error{color:#b91c1c}.provider-card{padding:14px 0;border-top:1px solid #eef0f2}.provider-card:first-child{border-top:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.provider{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:44px;height:44px;border-radius:13px;background:#f0f2f5;display:grid;place-items:center;font-weight:850;flex:none}.name{font-weight:800;font-size:16px}.type{font-size:12px;color:#6b7280;margin-top:3px}.price{font-size:22px;font-weight:850;text-align:right;white-space:nowrap}.price.best{font-size:24px}.eta{font-size:12px;color:#6b7280;text-align:right;margin-top:2px}.badge{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#ecfdf3;color:#15803d;font-size:11px;font-weight:750}.open-wrap{text-align:right;margin-top:10px;display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}.open{background:#111827;color:#fff;padding:9px 12px;font-size:13px}.copy{background:#eef1f5;color:#111827;padding:9px 12px;font-size:13px}.fare-input{width:105px;margin:0;padding:10px 9px;font-size:16px;text-align:right}.fare-wrap{display:flex;align-items:center;gap:5px}.best-wrap{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;padding:10px 12px;border-radius:12px;background:#f7f8fa}.best-label{font-size:12px;color:#6b7280}.best-name{font-size:14px;font-weight:800}.muted{color:#9ca3af}.note{font-size:12px;color:#8a8f98;line-height:1.55;padding:0 2px}.hint{font-size:12px;color:#6b7280;line-height:1.5;margin:8px 2px 0}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">RideCompare SG</div>
  <div class="sub">一次输入，比较 Grab、Gojek、TADA</div>

  <div class="card">
    <label for="from">起点</label>
    <input id="from" placeholder="例如 Icon" autocomplete="street-address">
    <label for="to">终点</label>
    <input id="to" placeholder="例如 VivoCity" autocomplete="street-address">
    <button id="compare" class="primary">开始比价</button>
  </div>

  <div id="results" class="card hidden">
    <div id="status" class="status">准备中…</div>
    <div id="best" class="best-wrap hidden"><div><div class="best-label">当前最低价</div><div id="bestName" class="best-name"></div></div><div id="bestFare" class="price best"></div></div>
    <div id="list"></div>
    <div class="hint">先点每个平台的「打开 App」查看实际报价，再把价格填进右侧。系统会自动标出最低价。点「复制行程」可复制起点和终点。</div>
  </div>

  <div class="note">价格是叫车当下的估价，会随供需变化。此网页不会保存账号、支付信息或平台登录凭证。实时报价以后仍可通过服务器端合作伙伴/API接入。</div>
</div>
<script>
const providers=[
 {id:"grab",name:"Grab",type:"GrabCar",scheme:"grab://",store:"https://apps.apple.com/sg/app/grab-food-delivery-taxi-ride/id647268330"},
 {id:"gojek",name:"Gojek",type:"GoCar",scheme:"gojek://",store:"https://apps.apple.com/sg/app/gojek/id944875099"},
 {id:"tada",name:"TADA",type:"Car",scheme:"tada://",store:"https://apps.apple.com/sg/app/tada-ride-hailing/id1412329684"}
];
const $=id=>document.getElementById(id),results=$("results"),list=$("list"),status=$("status"),compare=$("compare"),best=$("best");
const endpoint=window.RIDECOMPARE_API||"/api/quotes";
function escapeHtml(s){return String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function renderManual(){
  best.classList.add("hidden");
  list.innerHTML=providers.map(p=>`<div class="provider-card"><div class="row"><div class="provider"><div class="logo">${p.name[0]}</div><div><div class="name">${p.name}</div><div class="type">${p.type}</div></div></div><div class="fare-wrap"><span>S$</span><input class="fare-input" inputmode="decimal" placeholder="价格" data-fare="${p.id}" aria-label="${p.name}价格"></div></div><div class="open-wrap"><button class="open" onclick='openProvider(${JSON.stringify(p.id)})'>打开 ${p.name} App</button><button class="copy" onclick='copyTrip()'>复制行程</button></div></div>`).join("");
  list.querySelectorAll("input[data-fare]").forEach(el=>el.addEventListener("input",updateBest));
}
function updateBest(){
  const rows=providers.map(p=>{const el=document.querySelector(`[data-fare="${p.id}"]`);const n=Number(el?.value);return {p,n}}).filter(x=>Number.isFinite(x.n)&&x.n>0);
  if(!rows.length){best.classList.add("hidden");return}
  rows.sort((a,b)=>a.n-b.n);best.classList.remove("hidden");$("bestName").textContent=rows[0].p.name;$("bestFare").textContent="S$"+rows[0].n.toFixed(2);
  document.querySelectorAll("[data-fare]").forEach(el=>el.style.fontWeight="400");
  const low=document.querySelector(`[data-fare="${rows[0].p.id}"]`);if(low)low.style.fontWeight="800";
}
function normalize(data){const out={};if(!data||typeof data!=="object")return out;const src=data.results||data.quotes||data;for(const p of providers){const r=src[p.id]||src[p.name.toLowerCase()]||{};const fare=Number(r.fare??r.price??r.estimated_fare);if(Number.isFinite(fare)&&fare>0)out[p.id]={fare:fare.toFixed(2),eta:r.eta??r.pickup_eta??r.eta_min??null,vehicle:r.vehicle||r.ride_type||p.type,surge:r.surge??r.surge_active??false}}return out}
function applyLive(data){const normalized=normalize(data);let count=0;for(const p of providers){const r=normalized[p.id];const el=document.querySelector(`[data-fare="${p.id}"]`);if(r&&el){el.value=r.fare;count++}}if(count){status.className="status success";status.textContent=`已取得 ${count} 个实时报价 · 可继续手动比较`;updateBest()}return count}
async function copyTrip(){const from=$("from").value.trim(),to=$("to").value.trim();const text=`起点：${from}\n终点：${to}`;try{await navigator.clipboard.writeText(text);status.className="status success";status.textContent="行程已复制，可在 App 里粘贴"}catch(e){status.className="status";status.textContent="复制失败，请手动复制起点和终点"}}
window.openProvider=async id=>{const p=providers.find(x=>x.id===id);if(!p)return;const from=$("from").value.trim(),to=$("to").value.trim();localStorage.setItem("ridecompare_trip",JSON.stringify({from,to}));try{await navigator.clipboard.writeText(`起点：${from}\n终点：${to}`)}catch(e){};const started=Date.now();const fallback=setTimeout(()=>{if(Date.now()-started>=1200)window.location.href=p.store},1200);try{window.location.href=p.scheme}catch(e){clearTimeout(fallback);window.location.href=p.store}};
compare.onclick=async()=>{const from=$("from").value.trim(),to=$("to").value.trim();if(!from||!to){alert("请填写起点和终点");return}localStorage.setItem("ridecompare_trip",JSON.stringify({from,to}));results.classList.remove("hidden");compare.disabled=true;status.className="status";status.textContent="已准备好，请打开各 App 查看价格";renderManual();
  try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),4000);const res=await fetch(endpoint+"?from="+encodeURIComponent(from)+"&to="+encodeURIComponent(to),{headers:{Accept:"application/json"},signal:controller.signal});clearTimeout(timer);if(res.ok){const data=await res.json();applyLive(data)}}catch(e){}finally{compare.disabled=false}
};
const saved=localStorage.getItem("ridecompare_trip");if(saved){try{const t=JSON.parse(saved);if(t.from)$("from").value=t.from;if(t.to)$("to").value=t.to}catch(e){}}
</script>
</body>
</html>
