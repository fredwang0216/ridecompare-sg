<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>RideCompare SG — Grab / Gojek / TADA 比价</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}.wrap{max-width:620px;margin:auto;padding:22px 16px 44px}.brand{font-size:28px;font-weight:850;margin:8px 0 3px}.sub{color:#6b7280;font-size:14px;margin-bottom:18px}.card{background:#fff;border-radius:20px;padding:17px;box-shadow:0 5px 22px #11182712;margin-bottom:14px}label{display:block;font-size:12px;color:#6b7280;margin:2px 0 6px}input{width:100%;padding:15px 14px;border:1px solid #e5e7eb;border-radius:13px;font-size:16px;outline:0;margin-bottom:11px}input:focus{border-color:#111827}.primary{width:100%;border:0;border-radius:13px;background:#111827;color:#fff;font-size:16px;font-weight:800;min-height:50px;cursor:pointer}.primary:disabled{opacity:.55}.status{text-align:center;color:#6b7280;font-size:13px;padding:2px 0 10px}.status.ok{color:#15803d}.status.err{color:#b91c1c}.route{display:flex;justify-content:space-between;gap:10px;background:#f7f8fa;border-radius:13px;padding:10px 12px;margin-bottom:8px;font-size:12px;color:#6b7280}.route b{color:#111827}.provider{padding:15px 0;border-top:1px solid #eef0f2}.provider:first-of-type{border-top:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.left{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:13px;background:#eef1f5;display:grid;place-items:center;font-weight:850}.name{font-size:16px;font-weight:800}.type{font-size:12px;color:#6b7280;margin-top:3px}.price{text-align:right;font-size:21px;font-weight:850;white-space:nowrap}.range{font-size:11px;color:#6b7280;text-align:right;margin-top:2px}.badge{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:10px;font-weight:750}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}.actions button{border:0;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:750;cursor:pointer}.open{background:#111827;color:#fff}.copy{background:#eef1f5;color:#111827}.best{background:#f0fdf4;border-radius:14px;padding:12px;margin:5px 0 10px;display:flex;justify-content:space-between;align-items:center}.best small{display:block;color:#15803d;font-size:11px}.best b{font-size:14px}.best strong{font-size:22px}.note{font-size:12px;color:#8a8f98;line-height:1.55;padding:0 2px}.hidden{display:none}</style></head><body><div class="wrap"><div class="brand">RideCompare SG</div><div class="sub">一次输入，比较 Grab、Gojek、TADA</div><div class="card"><label>起点</label><input id="from" placeholder="例如 Icon" autocomplete="street-address"><label>终点</label><input id="to" placeholder="例如 VivoCity" autocomplete="street-address"><button id="compare" class="primary">开始比价</button></div><div id="results" class="card hidden"><div id="status" class="status">正在计算路线…</div><div id="route" class="route hidden"></div><div id="best" class="best hidden"><div><small>模型估算最低价</small><b id="bestName"></b></div><strong id="bestFare"></strong></div><div id="list"></div></div><div class="note">当前版本会自动计算路线距离并给出 Grab / Gojek / TADA 的<strong>估算价</strong>，不是平台实时报价。点击「打开 App」会打开对应平台；起点和终点会同时复制到剪贴板，避免重新输入。真正实时价格需要平台官方合作 API，不能靠猜参数冒充。</div></div><script>const P=[{id:'grab',name:'Grab',type:'GrabCar',scheme:'grab://',store:'https://apps.apple.com/sg/app/grab-food-delivery-taxi/id647268330'},{id:'gojek',name:'Gojek',type:'GoCar',scheme:'gojek://',store:'https://apps.apple.com/sg/app/gojek/id944875099'},{id:'tada',name:'TADA',type:'Car',scheme:'tada://',store:'https://apps.apple.com/sg/app/tada-ride-hailing/id1412329684'}];const $=id=>document.getElementById(id);const results=$('results'),status=$('status'),list=$('list'),route=$('route'),best=$('best');function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function copyTrip(){const text=`起点：${$('from').value.trim()}\n终点：${$('to').value.trim()}`;navigator.clipboard?.writeText(text).then(()=>{status.className='status ok';status.textContent='行程已复制到剪贴板，可直接粘贴到 App'}).catch(()=>{})}function openProvider(id){const p=P.find(x=>x.id===id);if(!p)return;copyTrip();const t=Date.now();let moved=false;const onVis=()=>{if(document.hidden)moved=true};document.addEventListener('visibilitychange',onVis);window.location.href=p.scheme;setTimeout(()=>{document.removeEventListener('visibilitychange',onVis);if(!moved&&Date.now()-t>900)window.location.href=p.store},1100)}function render(data){const q=data.quotes||{};const rows=P.map(p=>({p,r:q[p.id]})).filter(x=>x.r);list.innerHTML=rows.map(x=>`<div class="provider"><div class="row"><div class="left"><div class="logo">${x.p.name[0]}</div><div><div class="name">${x.p.name}</div><div class="type">${x.p.type}</div></div></div><div><div class="price">S$${Number(x.r.fare).toFixed(2)}</div><div class="range">约 S$${Number(x.r.fareLow).toFixed(2)}–${Number(x.r.fareHigh).toFixed(2)}</div></div></div><div class="actions"><button class="copy" onclick="copyTrip()">复制行程</button><button class="open" onclick="openProvider('${x.p.id}')">打开 ${x.p.name}</button></div></div>`).join('');const sorted=rows.slice().sort((a,b)=>a.r.fare-b.r.fare);if(sorted[0]){$('bestName').textContent=sorted[0].p.name;$('bestFare').textContent='S$'+Number(sorted[0].r.fare).toFixed(2);best.classList.remove('hidden')}}$('compare').onclick=async()=>{const from=$('from').value.trim(),to=$('to').value.trim();if(!from||!to){alert('请填写起点和终点');return}localStorage.setItem('ridecompare_trip',JSON.stringify({from,to}));results.classList.remove('hidden');best.classList.add('hidden');route.classList.add('hidden');list.innerHTML='';$('compare').disabled=true;status.className='status';status.textContent='正在计算路线和估算价格…';try{const r=await fetch('/api/quotes?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to));const d=await r.json();if(!r.ok)throw Error(d.message||'无法计算');route.innerHTML=`<span>路线 <b>${d.route.distanceKm} km</b></span><span>驾车约 <b>${d.route.durationMin} 分钟</b></span>`;route.classList.remove('hidden');render(d);status.className='status ok';status.textContent='已完成：以下是估算价（非实时平台报价）'}catch(e){status.className='status err';status.textContent='路线计算失败：'+e.message}finally{$('compare').disabled=false}};try{const s=JSON.parse(localStorage.getItem('ridecompare_trip')||'{}');if(s.from)$('from').value=s.from;if(s.to)$('to').value=s.to}catch(e){}</script></body></html>
